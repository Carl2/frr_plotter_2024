[tool.pytest]
pythonpath = "."

[project]
name = "frr_plotter_2024"
authors = [
        {name = "Calle Olsen"},
        {email = "olsen.carl@gmail.com"}
        ]
version = "0.0.1"
license = { text = "MIT" }
requires-python = ">=3.12"
description = "Parsing zwift frr values"
homepage = "https://cocode.se/"
repository = "https://github.com/Carl2/frr_plotter_2024"



[tool.poetry]
packages = [
         {include = "col", from = "src"},
         {include = "frr_parser_run.py", from = "src"}
]



[project.scripts]
frr_parser = "streamlit.web.cli:main_run src/frr_parser_run.py"


[dependencies]
python = "^3.12"
streamlit = "^1.42.0"
matplotlib = "3.9.2"
icecream = "2.1.3"
pymonad="2.4.0"
# Add your other dependencies here
